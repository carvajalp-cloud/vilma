services:
  db:
    image: postgres:16-alpine
    container_name: faz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: faz
      POSTGRES_PASSWORD: faz_password
      POSTGRES_DB: fortianalyzer
    ports:
      - "5432:5432"
    volumes:
      - faz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faz -d fortianalyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  faz_pgdata:
